appId: local.dataagent.desktop
productName: Data Agent
asar: true
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: runtime/report-runtime
    to: report-runtime
  - from: runtime/darwin-arm64
    to: runtime
  - from: resources/python
    to: python
    filter:
      - '**/*.py'
  - from: resources/skills
    to: skills
asarUnpack:
  - '**/*.node'
mac:
  identity: null
  target: dir
  category: public.app-category.productivity
npmRebuild: false
electronDist: node_modules/electron/dist
